name: Vendrith Chat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests
        run: npm run test:e2e
        env:
          # GitHub Actions secrets are separate from Codespaces secrets.
          # Keep this restricted to the explicitly approved Non-Production Supabase project.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          E2E_ACCOUNT_1_EMAIL: ${{ secrets.E2E_ACOOUNT_1_EMAIL }}
          E2E_ACCOUNT_1_PASSWORD: ${{ secrets.E2E_ACOOUNT_1_PASSWORD }}
          E2E_SUPABASE_AUTH: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' && '1' || '0' }}
      - name: Production build
        run: npm run build
